[project]
name = "recon-tool"
version = "0.1.0"
description = "Domain reconnaissance tool for pentesting"
authors = [
    {name = "filipebcs",email = "filipebcs8@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "python-whois (>=0.9.6,<0.10.0)",
    "ipwhois (>=1.3.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "shodan (>=1.31.0,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.poetry]
packages = [{ include = "recon_tool" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
